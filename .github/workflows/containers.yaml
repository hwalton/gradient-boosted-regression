name: Build and Publish Docker images

on:
  push:
    branches:
      - master
  # pull_request:
  #   branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push gbr-ml image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gbr-ml:latest
            ghcr.io/${{ github.repository_owner }}/gbr-ml:${{ github.sha }}

      - name: Build & push gbr-airflow image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.airflow
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gbr-airflow:latest
            ghcr.io/${{ github.repository_owner }}/gbr-airflow:${{ github.sha }}

      - name: Verify images pushed
        run: |
          echo "Images pushed:"
          echo " - ghcr.io/${{ github.repository_owner }}/gbr-ml:latest"
          echo " - ghcr.io/${{ github.repository_owner }}/gbr-airflow:latest"