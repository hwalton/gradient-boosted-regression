# Create k8s/simple-airflow.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: airflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-standalone
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-standalone
  template:
    metadata:
      labels:
        app: airflow-standalone
    spec:
      containers:
      - name: airflow
        image: apache/airflow:2.7.3
        command: ["airflow"]
        args: ["standalone"]
        ports:
        - containerPort: 8080
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "SequentialExecutor"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        volumeMounts:
        - name: airflow-home
          mountPath: /opt/airflow
        - name: shared-storage
          mountPath: /app/shared
      volumes:
      - name: airflow-home
        emptyDir: {}
      - name: shared-storage
        persistentVolumeClaim:
          claimName: ml-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: airflow
spec:
  selector:
    app: airflow-standalone
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort