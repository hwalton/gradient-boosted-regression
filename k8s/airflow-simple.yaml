# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-postgresql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgresql
  template:
    metadata:
      labels:
        app: airflow-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:13
        env:
        - name: POSTGRES_DB
          value: "airflow"
        - name: POSTGRES_USER
          value: "airflow"
        - name: POSTGRES_PASSWORD
          value: "airflow123"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgresql
spec:
  selector:
    app: airflow-postgresql
  ports:
  - port: 5432
    targetPort: 5432
---
# Airflow Deployment with Git-Sync
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-standalone
  template:
    metadata:
      labels:
        app: airflow-standalone
    spec:
      containers:
      - name: airflow
        image: apache/airflow:2.10.0  # Use stable version
        command: ["airflow"]
        args: ["standalone"]
        ports:
        - containerPort: 8080
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"
        - name: AIRFLOW__CORE__EXECUTOR  
          value: "LocalExecutor"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql://airflow:airflow123@airflow-postgresql:5432/airflow"
        - name: _PIP_ADDITIONAL_REQUIREMENTS
          value: "apache-airflow-providers-cncf-kubernetes==8.4.0"
        volumeMounts:
        - name: airflow-home
          mountPath: /opt/airflow
        - name: dags-volume
          mountPath: /opt/airflow/dags
        - name: shared-storage
          mountPath: /app/shared
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.0.0
        env:
        - name: GITSYNC_REPO
          value: "https://github.com/hwalton/gradient-boosted-regression.git"
        - name: GITSYNC_REF
          value: "master"
        - name: GITSYNC_PERIOD
          value: "60s"
        - name: GITSYNC_ROOT
          value: /tmp/git-repo  # Changed: sync to temp location
        command:
        - /bin/sh
        - -c
        - |
          # Start git-sync in background
          /git-sync &
          
          # Wait for initial sync
          sleep 10
          
          # Copy DAGs and keep monitoring
          while true; do
            if [ -d "/tmp/git-repo/gradient-boosted-regression/airflow/dags" ]; then
              echo "Syncing DAGs from Git..."
              cp -r /tmp/git-repo/gradient-boosted-regression/airflow/dags/* /opt/airflow/dags/ 2>/dev/null || true
              echo "DAGs synced at $(date)"
            else
              echo "Waiting for git-sync to complete..."
            fi
            sleep 60
          done
        volumeMounts:
        - name: git-volume
          mountPath: /tmp/git-repo
        - name: dags-volume
          mountPath: /opt/airflow/dags
      volumes:
      - name: airflow-home
        emptyDir: {}
      - name: dags-volume
        emptyDir: {}
      - name: git-volume  # Add this
        emptyDir: {}
      - name: shared-storage
        persistentVolumeClaim:
          claimName: ml-data-pvc
---
# Airflow Service
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
spec:
  selector:
    app: airflow-standalone
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort