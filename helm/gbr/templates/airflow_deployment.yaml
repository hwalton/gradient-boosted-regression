apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gbr.fullname" . }}-airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "gbr.fullname" . }}-airflow
  template:
    metadata:
      labels:
        app: {{ include "gbr.fullname" . }}-airflow
    spec:
      imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: airflow
          image: "{{ .Values.image.airflow.repository }}:{{ .Values.image.airflow.tag }}"
          imagePullPolicy: {{ .Values.image.airflow.pullPolicy }}
          command: ["airflow"]
          args: ["standalone"]
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__EXECUTOR
              value: "{{ .Values.airflow.executor }}"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: {{ default (printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user .Values.postgres.password (printf "%s-postgres" (include "gbr.fullname" .)) .Values.postgres.db) .Values.airflow.imageSqlAlchemyConn | quote }}
            {{- range $k, $v := .Values.airflow.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: shared-storage
              mountPath: /app/shared
      volumes:
        - name: airflow-home
          emptyDir: {}
        - name: shared-storage
          persistentVolumeClaim:
            claimName: ml-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gbr.fullname" . }}-airflow-webserver
spec:
  selector:
    app: {{ include "gbr.fullname" . }}-airflow
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort